[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grantweft"
version = "0.1.0"
description = "Bounded temporary service access gateway technical explorations"
requires-python = ">=3.12"
dependencies = []
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[project.scripts]
grantweft = "grantweft.client:main"
grantweft-gateway = "grantweft.gateway:main"

[tool.setuptools.packages.find]
include = ["grantweft*"]

[tool.setuptools.package-data]
grantweft = ["systemd/*.service"]
